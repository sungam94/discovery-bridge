[project]
name = "discovery-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "websockets>=15,<18",
  "playwright==1.63.0",
  "fastapi>=0.142,<0.143",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.20",
  "pyyaml>=6",
  "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "respx>=0.22", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge", "src/adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
